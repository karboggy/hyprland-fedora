name: Nightly Cleanup

on:
  workflow_call:
    inputs:
      protected_tags:
        description: Releases referenced by the successfully deployed Pages repository
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    name: Keep two nightly releases per Fedora version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Delete old nightly releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_TAGS: ${{ inputs.protected_tags }}
        run: python3 scripts/cleanup-nightly.py
