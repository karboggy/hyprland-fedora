name: Check repository scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/sign-rpms.sh
      - name: Test repository publication and cleanup
        run: python3 -m unittest discover -s tests -v
      - name: Install signing and metadata tools
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg createrepo-c
      - name: Verify real RPM signing and metadata with a disposable key
        run: bash tests/smoke-signing.sh
